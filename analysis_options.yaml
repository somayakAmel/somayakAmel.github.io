# Lint configuration adopted from ARCHITECTURE_GUIDE §22.5 ("Tighten the linter").
# The original project shipped flutter_lints defaults only; this project enables
# the recommended rule set from day one.
#
# Run with: flutter analyze
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    invalid_annotation_target: ignore
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
    - android/**
    - ios/**
    - web/**
    - macos/**
    - linux/**

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    # forces .dLog() over bare print() — guide §22.4
    - avoid_print
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - sort_child_properties_last
    - unnecessary_null_checks
    # catches the async-gap bugs flagged in guide §22.6
    - use_build_context_synchronously
