name: portfolio
description: "Flutter & Mobile Developer portfolio — a reference implementation of Clean Architecture in Flutter."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # Global Material/Widgets/Cupertino delegates + RTL support for Arabic (§12)
  flutter_localizations:
    sdk: flutter

  # Path URL strategy — clean shareable URLs on Web, no /#/ fragment (SPEC §5)
  flutter_web_plugins:
    sdk: flutter

  # State management — Cubits only (ARCHITECTURE_GUIDE §3)
  flutter_bloc: ^9.1.1
  equatable: ^2.1.0

  # Dependency injection — single GetIt instance exposed as `sl` (§4)
  get_it: ^9.2.1

  # Functional error handling — Either<Failure, T> (§8)
  dartz: ^0.10.1

  # Responsive sizing — clamped above the tablet breakpoint (SPEC §12)
  flutter_screenutil: ^5.9.3

  # SVG rendering for icons and logos (§13.3)
  flutter_svg: ^2.3.0

  # Contact actions: mailto / tel / https (SPEC §7.8)
  url_launcher: ^6.3.2

  # Persists ONLY the saved locale — not used as a database (SPEC §19)
  shared_preferences: ^2.5.5

  # One-shot section entrance animations (SPEC §13)
  visibility_detector: ^0.4.0+2

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  # [RULE] Declare folders, not individual files (§13.1).
  # EXCEPTION: folder declarations are NOT recursive — each project's
  # screenshot subfolder must be declared explicitly. See SPEC risk R-7.
  # When adding a project, add its folder here or its images silently 404
  # with no analyzer warning.
  assets:
    - assets/data/
    - assets/data/projects/
    - assets/images/
    # Project screenshots — one line per project, named after the project slug.
    # [RULE] Keep folder names slug-identical and free of spaces. Flutter
    # percent-encodes a space at bundle time, so "misr el-kheir" ships as
    # "misr%20el-kheir" and the served URL needs %2520 — it works, but it is a
    # trap for anyone hand-writing a path.
    - assets/images/projects/
    - assets/images/projects/masr_alkher/
    - assets/images/projects/yafleet/
    - assets/images/projects/motary/
    - assets/images/projects/qanony/
    - assets/images/projects/itutor/
    # These four are declared ahead of the content that will fill them:
    # icons and animations are referenced by AssetsManager, logos by each
    # skill's logo_path, certificates by each certificate's image_path.
    # They currently hold only a .gitkeep — git does not track empty
    # directories, so without it they vanish on a fresh clone and
    # `flutter analyze` fails CI with "asset directory doesn't exist".
    # Do not delete the .gitkeep files.
    - assets/icons/
    - assets/logos/
    - assets/certificates/
    - assets/animations/
    - assets/documents/
    - lang/

  # Two Latin families, one Arabic (design system §Typography):
  #   Space Grotesk — headlines. Technical without feeling robotic.
  #   Inter         — body. Built for reading long text at small sizes.
  #   IBM Plex Sans Arabic — the Arabic counterpart for both roles.
  #
  # The Latin families ship as VARIABLE fonts: one file covers every weight,
  # which is ~1.2MB smaller than four statics and matters on Web (risk R-1).
  fonts:
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/english/SpaceGrotesk-Variable.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/english/Inter-Variable.ttf
    - family: IBMPlexSansArabic
      fonts:
        - asset: assets/fonts/arabic/IBMPlexSansArabic-Regular.ttf
          weight: 400
        - asset: assets/fonts/arabic/IBMPlexSansArabic-Medium.ttf
          weight: 500
        - asset: assets/fonts/arabic/IBMPlexSansArabic-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/arabic/IBMPlexSansArabic-Bold.ttf
          weight: 700
