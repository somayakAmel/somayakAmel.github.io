<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <!--
    REQUIRED. Without this, mobile browsers render at a ~980px virtual desktop
    width and scale the result down, so every phone visitor sees a clipped,
    horizontally-overflowing page regardless of what the Dart layout does.
    This was a real bug, caught by screenshotting a 390px viewport.
  -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="description"
        content="Flutter &amp; Mobile Developer portfolio — production mobile apps across nonprofit, logistics, marketplace, legal-tech and education, built on Clean Architecture.">

  <!--
    Open Graph / Twitter Card tags.

    Flutter Web renders to canvas, so crawlers and link-preview bots read
    nothing from the running app. These static tags are what make a link shared
    on LinkedIn or WhatsApp show a title and description instead of a bare URL —
    which matters more for this audience than search ranking (SPEC risk R-1).

    TODO: add assets/images/og_image.png (1200x630) and point og:image at it.
    Until then a shared link shows title and description but no preview image.
  -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://somayakamel.github.io/">
  <meta property="og:title" content="Somaya Kamel — Flutter &amp; Mobile Developer">
  <meta property="og:description"
        content="Production Flutter apps across nonprofit, logistics, marketplace and legal-tech, built on Clean Architecture.">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Somaya Kamel — Flutter &amp; Mobile Developer">
  <meta name="twitter:description"
        content="Production Flutter apps across nonprofit, logistics, marketplace and legal-tech, built on Clean Architecture.">

  <!-- Tints mobile browser chrome to the page background. -->
  <meta name="theme-color" content="#0D0D0F">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Somaya Kamel">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!--
    Favicons, most-specific first. The .ico is listed for Safari and for
    Windows pinned tiles, which still prefer it over PNG; the 16/32 PNGs are
    what Chrome and Firefox actually use.

    NOTE: browsers cache favicons far more aggressively than page assets, and
    the cache often survives a hard refresh. After changing these, verify in a
    private window rather than assuming the deploy failed.
  -->
  <link rel="icon" type="image/x-icon" href="favicon.ico"/>
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32x32.png"/>
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16x16.png"/>

  <title>Somaya Kamel — Flutter &amp; Mobile Developer</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /*
      The Flutter engine ships several MB before it can paint anything. Without
      this the visitor stares at a white flash, then a blank page, and may leave
      before the app loads. Matching the app's own surface colour makes the gap
      read as loading rather than broken (SPEC risk R-1).
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0D0D0F;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      background-color: #0D0D0F;
      color: #F2F2F5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                   sans-serif;
      transition: opacity 300ms ease-out;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    /*
      Must match the Flutter splash exactly — min(62vw, 400px), dead centre —
      so the handoff when Flutter paints its first frame does not jump. See
      _splashLogoWidthFactor in splash_screen.dart. The width/height
      attributes on the <img> reserve its box before the file arrives.
    */
    #loading .logo {
      display: block;
      width: min(62vw, 400px);
      height: auto;
    }
    /*
      Positioned out of the flex flow so the logo alone is centred, as it is
      on the Flutter splash; the bar hangs 20px below the logo's bottom edge.
      The logo is 996x192, so its half-height is its width x 96/996.
    */
    #loading .bar {
      position: absolute;
      left: 50%;
      top: calc(50% + min(62vw, 400px) * 96 / 996 + 20px);
      transform: translateX(-50%);
      width: 120px;
      height: 2px;
      background-color: #232328;
      overflow: hidden;
      border-radius: 2px;
    }
    #loading .bar::after {
      content: '';
      display: block;
      width: 40%;
      height: 100%;
      background-color: #6C8EFF;
      animation: slide 1.1s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #loading .bar::after { animation: none; width: 100%; }
    }
  </style>
</head>
<body>
  <div id="loading">
    <!--
      Flutter's own asset path, so the browser caches it once and the Flutter
      splash that follows reuses it rather than downloading it again.
    -->
    <img class="logo" src="assets/assets/images/sk_logo.png"
         alt="Somaya Kamel" width="996" height="192" decoding="async">
    <div class="bar"></div>
  </div>

  <!--
    Plain-text fallback for crawlers and for anyone with JS disabled, so the
    page is never completely empty.
  -->
  <noscript>
    <div style="color:#F2F2F5;font-family:sans-serif;padding:32px;">
      <h1>Somaya Kamel</h1>
      <p>Flutter &amp; Mobile Developer</p>
      <p>This portfolio requires JavaScript.
         Reach me at <a style="color:#6C8EFF"
         href="mailto:somayaa.kamell@gmail.com">somayaa.kamell@gmail.com</a>.</p>
    </div>
  </noscript>

  <script>
    // Remove the placeholder once Flutter paints its first frame.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading');
      if (!el) return;
      el.classList.add('hidden');
      setTimeout(function () { el.remove(); }, 300);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
